worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Keep the edge limit aligned with the API's default
        # ATTACHMENT_MAX_REQUEST_SIZE (52MB). If operators raise that backend
        # limit, they must raise this value in the derived web image as well.
        client_max_body_size 52m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https://youtube.com https://*.youtube.com https://youtu.be https://*.youtu.be https://bilibili.com https://*.bilibili.com https://b23.tv https://*.b23.tv https://figma.com https://*.figma.com https://amap.com https://*.amap.com https://maps.google.com https://music.163.com https://*.music.163.com https://open.spotify.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location /api/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The API trusts the address supplied by this private reverse proxy for
            # authentication throttles and security audit metadata. Never preserve
            # a client-provided X-Forwarded-For value here, otherwise the caller can
            # choose the left-most address consumed by the application.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /actuator/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /collaboration/ {
            rewrite ^/collaboration/(.*)$ /api/v1/collaboration/$1 break;
            proxy_pass http://collab:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /collaboration-health/ {
            rewrite ^/collaboration-health/(.*)$ /health/$1 break;
            proxy_pass http://collab:8090;
        }

        location = /index.html {
            expires -1;
        }

        location ~* ^/assets/.*\.(?:css|js|woff2?|png|jpe?g|gif|svg|webp|avif)$ {
            try_files $uri =404;
            expires 1y;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
