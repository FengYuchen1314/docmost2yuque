spring:
  application:
    name: knowledge-platform-worker
  main:
    web-application-type: none
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${DATABASE_USER:knowledge}
    password: ${DATABASE_PASSWORD:knowledge}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: false
  jooq:
    sql-dialect: postgres

worker:
  id: ${WORKER_ID:${HOSTNAME:worker-local}}
  poll-delay: ${WORKER_POLL_DELAY:250ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

security:
  settings-master-key: ${SETTINGS_MASTER_KEY:}

platform:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
