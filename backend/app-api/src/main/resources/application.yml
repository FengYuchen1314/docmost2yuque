spring:
  application:
    name: knowledge-platform-api
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${DATABASE_USER:knowledge}
    password: ${DATABASE_PASSWORD:knowledge}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:50MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:52MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres
  modulith:
    runtime:
      verification-enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: KP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
      timeout: ${SESSION_TIMEOUT:12h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  settings-master-key: ${SETTINGS_MASTER_KEY:}

platform:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  storage:
    local-root: ${ATTACHMENT_STORAGE_ROOT:/var/lib/knowledge-platform/attachments}
    maximum-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:52428800}
